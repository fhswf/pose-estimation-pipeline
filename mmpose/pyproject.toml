[build-system]
requires = ["setuptools>=61.0", "wheel", "numpy", "cython", "pip", "setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mmpose"
version = "1.3.2"
description = "OpenMMLab Pose Estimation Toolbox and Benchmark."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "MMPose Contributors", email = "openmmlab@gmail.com"}
]
keywords = ["computer vision", "pose estimation"]
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]

dependencies = [
    "chumpy",
    "json_tricks",
    "matplotlib",
    "munkres",
    "numpy",
    "opencv-python",
    "pillow",
    "scipy",
    "torchvision",
    "xtcocotools>=1.12",
]

[project.optional-dependencies]
tests = [
    "coverage",
    "flake8",
    "interrogate",
    "isort==4.3.21",
    "parameterized",
    "pytest",
    "pytest-runner",
    "xdoctest>=0.10.0",
    "yapf",
]
optional = [
    "requests",
]
build = [
    "numpy",
    "torch>=1.8",
]

[project.urls]
Homepage = "https://github.com/open-mmlab/mmpose"
Documentation = "https://mmpose.readthedocs.io"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["configs", "tools", "demo"]

[tool.setuptools.package-data]
mmpose = ["ops/*/*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
